name: Automation framework compatibility

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  compatibility:
    name: PassFail Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:ci
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: automation-framework-compatibility
          path: reports/
      - name: Publish compatibility evidence to PassFail
        if: ${{ github.event_name == 'workflow_dispatch' && vars.PASSFAIL_API_URL != '' }}
        env:
          PASSFAIL_TEST_RESULTS_URL: ${{ vars.PASSFAIL_API_URL }}/evidence-reports
          PASSFAIL_CHECK_EVALUATIONS_URL: ${{ vars.PASSFAIL_API_URL }}/check-evaluations
          PASSFAIL_API_TOKEN: ${{ secrets.PASSFAIL_API_TOKEN }}
          PASSFAIL_SUBJECT_KEY: ${{ github.sha }}
          PASSFAIL_UPLOAD_GENERATION: github-${{ github.run_id }}-${{ github.run_attempt }}
        run: npm run passfail:publish
